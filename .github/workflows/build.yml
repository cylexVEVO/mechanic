name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

  build:
    name: Build executables
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cross-compile and package
        shell: bash
        run: |
          set -euo pipefail

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )

          mkdir -p dist

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            archive_name="mechanic_${goos}_${goarch}"
            package_dir="dist/${archive_name}"
            executable="mechanic"

            if [[ "$goos" == "windows" ]]; then
              executable="mechanic.exe"
            fi

            mkdir -p "$package_dir"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w" -o "${package_dir}/${executable}" .

            if [[ "$goos" == "windows" ]]; then
              (cd "$package_dir" && zip -q "../${archive_name}.zip" "$executable")
            else
              tar -C "$package_dir" -czf "dist/${archive_name}.tar.gz" "$executable"
            fi

            rm -r "$package_dir"
          done

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Upload downloadable executables
        uses: actions/upload-artifact@v7
        with:
          name: mechanic-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged executables
        uses: actions/download-artifact@v8
        with:
          name: mechanic-binaries
          path: dist

      - name: Create release and upload executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$TAG_NAME"
          fi
